# ./netlify.toml

[build]
  command = "[ -n \"$SUPABASE_URL\" ] && [ -n \"$SUPABASE_ANON_KEY\" ] || (echo 'Missing SUPABASE_URL or SUPABASE_ANON_KEY in Netlify environment variables.' && exit 1); printf '{\n  \"Supabase\": {\n    \"Url\": \"%s\",\n    \"AnonKey\": \"%s\"\n  }\n}\n' \"$SUPABASE_URL\" \"$SUPABASE_ANON_KEY\" > wwwroot/appsettings.json && dotnet publish -c Release"
  publish = "bin/Release/net10.0/publish/wwwroot"

[build.environment]
  DOTNET_VERSION = "10.0.100"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
